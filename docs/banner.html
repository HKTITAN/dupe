<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>dupe banner</title>
<style id="fonts">
  /* Nunito variable, latin subset, SIL Open Font License. */
  @font-face { font-family: Nunito; font-weight: 200 1000; font-style: normal; src: url(banner/nunito.woff2) format("woff2"); }
</style>
<style>
  html, body { margin: 0; background: #ffffff; }
  .banner {
    position: relative; width: 1200px; height: 675px; overflow: hidden; box-sizing: border-box;
    background: #ffffff; color: #3c3c3c; font-family: Nunito, "Segoe UI", system-ui, sans-serif;
    display: grid; grid-template-columns: 500px 1fr; align-items: center; padding: 56px 64px;
  }
  .copy h1 { font-weight: 900; font-size: 60px; line-height: 1.02; letter-spacing: -0.02em; margin: 0; text-transform: lowercase; color: #3c3c3c; }
  .copy p { font-weight: 700; font-size: 22px; line-height: 1.35; color: #6f6f6f; margin: 22px 0 0; max-width: 420px; }
  .copy .url { display: inline-flex; align-items: center; gap: 12px; margin-top: 34px; font-weight: 900; font-size: 24px; color: #1b91e3; }
  .copy .url svg { width: 34px; height: 34px; }
  .grid { display: grid; grid-template-columns: 96px repeat(4, 116px); grid-auto-rows: 116px; gap: 10px 8px; justify-content: end; align-items: center; }
  .grid .h { font-weight: 900; font-size: 15px; letter-spacing: 0.04em; text-transform: uppercase; color: #6f6f6f; text-align: center; height: auto; }
  .grid .h.stock { color: #afafaf; }
  .grid .r { font-weight: 900; font-size: 16px; color: #3c3c3c; text-align: right; padding-right: 8px; }
  .grid img { width: 108px; height: 108px; display: block; margin: 0 auto; border-radius: 24px; }
  .grid .h.c { color: var(--c); }
  .badge { position: absolute; right: 64px; bottom: 30px; font-weight: 700; font-size: 15px; color: #afafaf; }
  #export { position: fixed; left: 16px; top: 700px; font: 700 14px Nunito, sans-serif; }
</style>
</head>
<body>
<div class="banner" id="banner">
  <div class="copy">
    <h1>one app, as many profiles as you need</h1>
    <p>Claude, ChatGPT, Grok Bot or any Electron app. Own login, own data, own icon per profile. macOS, Windows, Linux.</p>
    <div class="url">
      <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#1b91e3"/><rect x="14" y="14" width="22" height="22" rx="6" fill="#fff" opacity=".55"/><rect x="28" y="28" width="22" height="22" rx="6" fill="#fff"/></svg>
      github.com/HKTITAN/dupe
    </div>
  </div>
  <div class="grid">
    <div></div>
    <div class="h stock">personal</div>
    <div class="h c" style="--c:#1b91e3">work</div>
    <div class="h c" style="--c:#25a351">client a</div>
    <div class="h c" style="--c:#996fda">sandbox</div>

    <div class="r">Claude</div>
    <img src="banner/claude.png" alt=""><img src="banner/claude-blue.png" alt=""><img src="banner/claude-green.png" alt=""><img src="banner/claude-purple.png" alt="">

    <div class="r">ChatGPT</div>
    <img src="banner/chatgpt.png" alt=""><img src="banner/chatgpt-blue.png" alt=""><img src="banner/chatgpt-green.png" alt=""><img src="banner/chatgpt-purple.png" alt="">

    <div class="r">Grok Bot</div>
    <img src="banner/grok.png" alt=""><img src="banner/grok-blue.png" alt=""><img src="banner/grok-green.png" alt=""><img src="banner/grok-purple.png" alt="">
  </div>
  <div class="badge">blue still means work · after @wustep</div>
</div>
<button id="export" type="button">Export PNG (2400×1350)</button>
<script>
// Renders the banner to a 2x PNG in the browser: fonts and images are
// inlined as data URIs, the DOM is serialised into an SVG foreignObject and
// drawn on a canvas. Open with ?download to export on load.
async function toDataUri(url) {
  const r = await fetch(url); const b = await r.blob();
  return new Promise((res) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.readAsDataURL(b); });
}
async function inlinedFontCss() {
  const css = document.getElementById('fonts').textContent;
  const urls = [...new Set([...css.matchAll(/url\(([^)]+)\)/g)].map((m) => m[1]))];
  let out = css;
  for (const u of urls) out = out.split(u).join(await toDataUri(u));
  return out;
}
// Draws the same composition with the canvas API (foreignObject would taint
// the canvas in Chrome). Fonts come from the document, images are same-origin.
async function renderBanner(scale = 2) {
  await document.fonts.load('900 60px Nunito'); await document.fonts.load('700 22px Nunito');
  const c = document.createElement('canvas'); c.width = 1200 * scale; c.height = 675 * scale;
  const g = c.getContext('2d'); g.scale(scale, scale);
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, 1200, 675);
  const wrap = (text, font, maxW) => { g.font = font; const words = text.split(' '); const lines = []; let line = ''; for (const w of words) { const t = line ? line + ' ' + w : w; if (g.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; } if (line) lines.push(line); return lines; };
  // Left column
  let y = 176;
  g.fillStyle = '#3c3c3c'; g.textBaseline = 'alphabetic';
  for (const line of wrap('one app, as many profiles as you need', '900 60px Nunito', 440)) { g.font = '900 60px Nunito'; g.letterSpacing = '-1.2px'; g.fillText(line, 64, y); y += 61; }
  g.letterSpacing = '0px'; y += 14;
  g.fillStyle = '#6f6f6f';
  for (const line of wrap('Claude, ChatGPT, Grok Bot or any Electron app. Own login, own data, own icon per profile. macOS, Windows, Linux.', '700 22px Nunito', 420)) { g.font = '700 22px Nunito'; g.fillText(line, 64, y); y += 30; }
  y += 30;
  const rr = (x, yy, w, h, r) => { g.beginPath(); g.roundRect(x, yy, w, h, r); };
  rr(64, y - 26, 34, 34, 7); g.fillStyle = '#1b91e3'; g.fill();
  rr(64 + 7.4, y - 26 + 7.4, 11.7, 11.7, 3); g.fillStyle = 'rgba(255,255,255,0.55)'; g.fill();
  rr(64 + 14.9, y - 26 + 14.9, 11.7, 11.7, 3); g.fillStyle = '#fff'; g.fill();
  g.fillStyle = '#1b91e3'; g.font = '900 24px Nunito'; g.fillText('github.com/HKTITAN/dupe', 110, y);
  // Right grid
  const cols = [{ t: 'personal', c: '#afafaf' }, { t: 'work', c: '#1b91e3' }, { t: 'client a', c: '#25a351' }, { t: 'sandbox', c: '#996fda' }];
  const rows = [['Claude', 'claude'], ['ChatGPT', 'chatgpt'], ['Grok Bot', 'grok']];
  const suffix = ['', '-blue', '-green', '-purple'];
  const x0 = 1136 - (96 + 4 * 116 + 4 * 8), top = 138;
  g.textAlign = 'center'; g.font = '900 15px Nunito'; g.letterSpacing = '0.6px';
  cols.forEach((col, i) => { g.fillStyle = col.c; g.fillText(col.t.toUpperCase(), x0 + 96 + 8 + i * 124 + 58, top + 16); });
  g.letterSpacing = '0px';
  const load = (src) => new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = src; });
  for (let r = 0; r < rows.length; r++) {
    const cy = top + 30 + r * 126;
    g.textAlign = 'right'; g.fillStyle = '#3c3c3c'; g.font = '900 16px Nunito'; g.fillText(rows[r][0], x0 + 96 - 8, cy + 64);
    for (let i = 0; i < 4; i++) {
      const im = await load(`banner/${rows[r][1]}${suffix[i]}.png`);
      const x = x0 + 96 + 8 + i * 124 + 4, yy = cy + 4;
      g.save(); rr(x, yy, 108, 108, 24); g.clip(); g.drawImage(im, x, yy, 108, 108); g.restore();
    }
  }
  g.textAlign = 'right'; g.fillStyle = '#afafaf'; g.font = '700 15px Nunito'; g.fillText('blue still means work · after @wustep', 1136, 650);
  return c;
}
async function exportPng() {
  const c = await renderBanner(2);
  const blob = await new Promise((res) => c.toBlob(res, 'image/png'));
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'dupe-banner.png';
  document.body.appendChild(a); a.click(); a.remove();
  document.getElementById('export').textContent = 'Exported dupe-banner.png';
}
document.getElementById('export').addEventListener('click', exportPng);
if (location.search.includes('download')) window.addEventListener('load', () => setTimeout(exportPng, 800));
</script>
</body>
</html>
